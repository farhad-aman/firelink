[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "firelink"
version = "0.4.0"
description = "Terminal download manager over aria2c"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["textual>=0.80", "tomlkit>=0.13", "yt-dlp[default]>=2025.1.1", "mutagen>=1.47"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dl = "dl.__main__:main"

[tool.setuptools.packages.find]
include = ["dl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: reaches the real Spotify and YouTube; run on demand"]
